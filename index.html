<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Asistencia a capacitaciones</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #f4f6f8; color: #1f2933; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    select, button { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 8px; box-sizing: border-box; border-radius: 8px; border: 1px solid #c4ccd4; }
    button { background: #1b6ca8; color: #fff; border: none; cursor: pointer; }
    button.sec { background: #52606d; }
    #lector { width: 100%; max-width: 400px; margin: 8px auto; }
    #resultado { padding: 14px; border-radius: 8px; margin: 8px 0; font-size: 16px; display: none; word-break: break-word; overflow-wrap: anywhere; }
    .OK { background: #d4f5dd; color: #11632b; }
    .DUPLICADO { background: #fff3c4; color: #7a5b00; }
    .NO_ENCONTRADO, .INVALIDO, .ERROR { background: #fbd5d5; color: #8a1c1c; }
    #datosQR { display: none; background: #fff; border-radius: 8px; padding: 8px; margin: 8px 0; font-size: 13px; }
    #datosQR h2 { font-size: 14px; margin: 4px 0 8px; }
    #datosQR table td { vertical-align: top; word-break: break-word; overflow-wrap: anywhere; }
    #datosQR table td:first-child { font-weight: bold; width: 40%; color: #52606d; }
    table { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; }
    th, td { padding: 8px; border-bottom: 1px solid #e4e7eb; text-align: left; }
    #contador { font-weight: bold; margin: 12px 0 6px; }
  </style>
</head>
<body>
  <h1>Asistencia a capacitaciones</h1>

  <select id="capacitacion"></select>
  <button id="btnIniciar" style="display:none">Abrir escáner</button>
  <button class="sec" id="btnClave">Cambiar clave de acceso</button>

  <div id="lector"></div>
  <div id="resultado"></div>

  <div id="datosQR">
    <h2>Datos leídos del QR</h2>
    <table><tbody id="datosQRcuerpo"></tbody></table>
  </div>

  <div id="contador"></div>
  <table>
    <thead><tr><th>Hora</th><th>Nombre</th><th>Área</th></tr></thead>
    <tbody id="lista"></tbody>
  </table>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbxjrElq-rrZrkRsNOjjdi9WBLfB5LXZxl3Et_Qc15v4ODmtDN8-BwmtjRNstJ4FtaZH/exec';

  let scanner = null;
  let ocupado = false;
  let ultimoTexto = '';
  let ultimoTiempo = 0;

  function getClave() {
    let c = '';
    try { c = localStorage.getItem('clave_asistencia') || ''; } catch (e) {}
    if (!c) {
      c = (prompt('Clave de acceso:') || '').trim();
      try { localStorage.setItem('clave_asistencia', c); } catch (e) {}
    }
    return c;
  }

  function borrarClave() {
    try { localStorage.removeItem('clave_asistencia'); } catch (e) {}
  }

  async function llamar(accion, extra) {
    const cuerpo = Object.assign({ accion: accion, clave: getClave() }, extra || {});
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(cuerpo)
    });
    const json = await resp.json();
    if (!json.ok) {
      if (json.error === 'Clave incorrecta') borrarClave();
      throw new Error(json.error || 'Error desconocido');
    }
    return json.data;
  }

  function idCap() { return document.getElementById('capacitacion').value; }

  function sinAcentos(s) {
    return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }

  function texto(v) {
    if (v === null || v === undefined) return '';
    if (typeof v === 'object') return JSON.stringify(v);
    return String(v);
  }

  // Devuelve el primer número de 10+ dígitos entre los campos cuyo nombre cumple el patrón
  function buscarNumero(obj, claves, patron) {
    for (let i = 0; i < claves.length; i++) {
      if (!patron.test(sinAcentos(claves[i]))) continue;
      const dig = texto(obj[claves[i]]).replace(/\D/g, '');
      if (dig.length >= 10) return dig.slice(-10);
    }
    return null;
  }

  // Abre el paquete del QR. Prioridad: CELULAR. Respaldo: teléfono.
  // Solo el número se envía al Sheet.
  function analizarQR(textoQR) {
    let obj = null;
    try { obj = JSON.parse(textoQR); } catch (e) {}

    if (obj && typeof obj === 'object' && !Array.isArray(obj)) {
      const claves = Object.keys(obj);
      let tel = buscarNumero(obj, claves, /(cel|movil|mobile)/);
      let origen = 'celular';
      if (!tel) {
        tel = buscarNumero(obj, claves, /(tel|phone)/);
        origen = 'teléfono';
      }
      return { todos: obj, tel: tel, origen: origen };
    }

    // QR que no es paquete de datos: se toma el texto como número
    const dig = String(textoQR).replace(/\D/g, '');
    return {
      todos: { Contenido: textoQR },
      tel: dig.length >= 10 ? dig.slice(-10) : null,
      origen: 'texto'
    };
  }

  function mostrarDatos(obj) {
    const cuerpo = document.getElementById('datosQRcuerpo');
    cuerpo.innerHTML = '';
    Object.keys(obj).forEach(function (k) {
      const tr = document.createElement('tr');
      const td1 = document.createElement('td');
      const td2 = document.createElement('td');
      td1.textContent = k;
      td2.textContent = texto(obj[k]);
      tr.appendChild(td1);
      tr.appendChild(td2);
      cuerpo.appendChild(tr);
    });
    document.getElementById('datosQR').style.display = 'block';
  }

  function pitido(ok) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)
