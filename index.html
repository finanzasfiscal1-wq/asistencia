<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Asistencia a capacitaciones</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #f4f6f8; color: #1f2933; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    select, button { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 8px; box-sizing: border-box; border-radius: 8px; border: 1px solid #c4ccd4; }
    button { background: #1b6ca8; color: #fff; border: none; cursor: pointer; }
    button.sec { background: #52606d; }
    #lector { width: 100%; max-width: 400px; margin: 8px auto; }
    #resultado { padding: 14px; border-radius: 8px; margin: 8px 0; font-size: 16px; display: none; word-break: break-word; overflow-wrap: anywhere; }
    .OK { background: #d4f5dd; color: #11632b; }
    .DUPLICADO { background: #fff3c4; color: #7a5b00; }
    .NO_ENCONTRADO, .INVALIDO, .ERROR { background: #fbd5d5; color: #8a1c1c; }
    table { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; }
    th, td { padding: 8px; border-bottom: 1px solid #e4e7eb; text-align: left; }
    #contador { font-weight: bold; margin: 12px 0 6px; }
  </style>
</head>
<body>
  <h1>Asistencia a capacitaciones</h1>

  <select id="capacitacion"></select>
  <button id="btnIniciar" style="display:none">Abrir escáner</button>
  <button class="sec" id="btnClave">Cambiar clave de acceso</button>

  <div id="lector"></div>
  <div id="resultado"></div>

  <div id="contador"></div>
  <table>
    <thead><tr><th>Hora</th><th>Nombre</th><th>Área</th></tr></thead>
    <tbody id="lista"></tbody>
  </table>

<script>
  const API_URL = 'PEGA_AQUI_TU_URL_EXEC';

  let scanner = null;
  let ocupado = false;
  let ultimoTexto = '';
  let ultimoTiempo = 0;

  function getClave() {
    let c = '';
    try { c = localStorage.getItem('clave_asistencia') || ''; } catch (e) {}
    if (!c) {
      c = (prompt('Clave de acceso:') || '').trim();
      try { localStorage.setItem('clave_asistencia', c); } catch (e) {}
    }
    return c;
  }

  function borrarClave() {
    try { localStorage.removeItem('clave_asistencia'); } catch (e) {}
  }

  async function llamar(accion, extra) {
    const cuerpo = Object.assign({ accion: accion, clave: getClave() }, extra || {});
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(cuerpo)
    });
    const json = await resp.json();
    if (!json.ok) {
      if (json.error === 'Clave incorrecta') borrarClave();
      throw new Error(json.error || 'Error desconocido');
    }
    return json.data;
  }

  function idCap() { return document.getElementById('capacitacion').value; }

  function sinAcentos(s) {
    return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }

  // Abre el paquete del QR y saca SOLO el teléfono (10 dígitos).
  // Los demás datos (nacimiento, dirección, etc.) nunca se envían.
  function extraerTelefono(texto) {
    let obj = null;
    try { obj = JSON.parse(texto); } catch (e) {}

    if (obj && typeof obj === 'object' && !Array.isArray(obj)) {
      const claves = Object.keys(obj);
      const candidatas = claves.filter(function (k) {
        return /(tel|cel|phone|movil)/.test(sinAcentos(k));
      });
      for (let i = 0; i < candidatas.length; i++) {
        const dig = String(obj[candidatas[i]] == null ? '' : obj[candidatas[i]]).replace(/\D/g, '');
        if (dig.length >= 10) return { tel: dig.slice(-10), claves: claves };
      }
      return { tel: null, claves: claves };
    }

    // QR que no es paquete de datos: se toma el texto como teléfono
    const dig = String(texto).replace(/\D/g, '');
    if (dig.length >= 10) return { tel: dig.slice(-10), claves: [] };
    return { tel: null, claves: [] };
  }

  function pitido(ok) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.frequency.value = ok ? 880 : 300;
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + (ok ? 0.15 : 0.4));
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(ok ? 150 : [100, 80, 100]);
  }

  function mostrar(r) {
    const div = document.getElementById('resultado');
    const icono = r.estado === 'OK' ? '✔ ' : r.estado === 'DUPLICADO' ? '⚠ ' : '✖ ';
    div.className = r.estado;
    div.textContent = '';
    if (r.nombre) {
      const b = document.createElement('b');
      b.textContent = r.nombre + ' (' + r.area + ')';
      div.appendChild(b);
      div.appendChild(document.createElement('br'));
    }
    div.appendChild(document.createTextNode(icono + r.mensaje));
    div.style.display = 'block';
  }

  async function cargarCapacitaciones() {
    const sel = document.getElementById('capacitacion');
    try {
      const caps = await llamar('capacitaciones');
      if (!caps.length) {
        sel.innerHTML = '<option value="">No hay capacitaciones abiertas</option>';
        return;
      }
      sel.innerHTML = '';
      caps.forEach(function (c) {
        const o = document.createElement('option');
        o.value = c.id;
        o.textContent = c.etiqueta;
        sel.appendChild(o);
      });
      await cargarLista();
      iniciar();
    } catch (e) {
      mostrar({ estado: 'ERROR', mensaje: e.message });
    }
  }

  async function cargarLista() {
    if (!idCap()) return;
    try {
      const filas = await llamar('lista', { idCap: idCap() });
      document.getElementById('contador').textContent = 'Asistentes: ' + filas.length;
      const tbody = document.getElementById('lista');
      tbody.innerHTML = '';
      filas.forEach(function (f) {
        const tr = document.createElement('tr');
        [f.hora, f.nombre, f.area].forEach(function (t) {
          const td = document.createElement('td');
          td.textContent = t;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    } catch (e) {
      mostrar({ estado: 'ERROR', mensaje: e.message });
    }
  }

  async function onScan(texto) {
    const ahora = Date.now();
    if (ocupado) return;
    if (texto === ultimoTexto && ahora - ultimoTiempo < 4000) return;
    ocupado = true;
    ultimoTexto = texto;
    ultimoTiempo = ahora;

    const ext = extraerTelefono(texto);
    if (!ext.tel) {
      const campos = ext.claves.length ? ext.claves.join(', ') : '(el QR no es un paquete de datos)';
      mostrar({ estado: 'INVALIDO', mensaje: 'No encontré el campo del teléfono. Campos del QR: ' + campos });
      pitido(false);
      setTimeout(function () { ocupado = false; }, 1200);
      return;
    }

    try {
      const r = await llamar('registrar', { idCap: idCap(), texto: ext.tel });
      mostrar(r);
      pitido(r.estado === 'OK');
      if (r.estado === 'OK') cargarLista();
    } catch (e) {
      mostrar({ estado: 'ERROR', mensaje: e.message });
      pitido(false);
    }
    setTimeout(function () { ocupado = false; }, 1200);
  }

  function iniciar() {
    if (!idCap() || scanner) return;
    scanner = new Html5Qrcode('lector');
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScan,
      function () {}
    ).then(function () {
      document.getElementById('btnIniciar').style.display = 'none';
    }).catch(function (e) {
      scanner = null;
      document.getElementById('btnIniciar').style.display = 'block';
      mostrar({ estado: 'ERROR', mensaje: 'No se pudo abrir la cámara: ' + e });
    });
  }

  document.getElementById('btnIniciar').onclick = iniciar;
  document.getElementById('btnClave').onclick = function () {
    borrarClave();
    cargarCapacitaciones();
  };
  document.getElementById('capacitacion').onchange = cargarLista;
  window.onload = cargarCapacitaciones;
</script>
</body>
</html>
